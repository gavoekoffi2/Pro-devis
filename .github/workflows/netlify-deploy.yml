name: Deploy to Netlify

on:
  push:
    branches:
      - main
      - claude/pro-devis-quote-app-hzos25
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # La base est configurée dans Netlify. On récupère sa valeur sans
      # l'afficher afin d'utiliser exactement la même base pour le build,
      # le contrôle de migration et le runtime de production.
      - name: Resolve production database
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          DATABASE_URL="$(npx netlify-cli@latest env:get DATABASE_URL \
            --context production \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN")"
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is missing in Netlify production."
            exit 1
          fi
          echo "::add-mask::$DATABASE_URL"
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          OPENROUTER_SEARCH_MODEL: ${{ vars.OPENROUTER_SEARCH_MODEL }}

      # Synchronise le schéma et le catalogue métiers (seed idempotent).
      # Le contrôle explicite arrête le déploiement avant toute modification
      # si des numéros de devis sont déjà en double.
      - name: Sync database schema & catalog
        run: |
          node <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          (async () => {
            const duplicates = await prisma.$queryRawUnsafe(
              'SELECT "companyId", "number", COUNT(*)::int AS count FROM "Quote" GROUP BY "companyId", "number" HAVING COUNT(*) > 1 LIMIT 1'
            );
            if (duplicates.length) {
              throw new Error('Duplicate quote numbers detected; database migration aborted.');
            }
          })().finally(() => prisma.$disconnect());
          NODE
          npx prisma db push
          npx tsx prisma/seed.ts

      - name: Deploy to Netlify
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "Netlify deployment skipped: NETLIFY_AUTH_TOKEN or NETLIFY_SITE_ID is missing."
            exit 0
          fi
          npx netlify-cli@latest deploy --prod --build --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          OPENROUTER_SEARCH_MODEL: ${{ vars.OPENROUTER_SEARCH_MODEL }}
